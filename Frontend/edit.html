<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
  <script src="app.js"></script>
  <title>Gestor de contraseñas</title>
</head>
<body style="background-color: rgb(173, 197, 240);">
  <!-- Formulario para editar un registro existente -->
  <div id="main" class="container">
    <div id="marco" class="container my-5 text-center">
      <h1>Gestor de contraseñas - Editar</h1>
      <div class="form-group">
        <label for="id_baul">Id:</label>
        <input type="text" class="form-control" id="id_baul" readonly>
      </div>
      <div class="form-group">
        <label for="plataforma">Plataforma:</label>
        <input type="text" class="form-control" id="plataforma">
      </div>
      <div class="form-group">
        <label for="usuario">Usuario:</label>
        <input type="text" class="form-control" id="usuario">
      </div>
      <div class="form-group">
        <label for="clave">Nueva clave:</label>
        <input type="password" class="form-control" id="clave" placeholder="nueva clave">
      </div>
      <div class="tarjeta">
        <button type="button" class="btn btn-info" onclick="modificar()"><img src="imagenes/salvar.png" height="30" width="30" alt=""> Actualizar</button>
        <button type="button" class="btn btn-warning" onclick="location.href='index.html'"><img src="imagenes/atras.png" height="30" width="30" alt=""> Regresar</button>
      </div>
    </div>
  </div>
  <script>
    consulta_individual(); // Carga los datos del registro a editar
  </script>
</body>
</html>
